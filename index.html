<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Từ Vựng Tiếng Trung Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --gray-text: #6b7280;
            --border: #e5e7eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; font-size: 24px; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
        .tab-btn { background: #e5e7eb; border: none; padding: 10px 20px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .flashcard-container { perspective: 1000px; width: 100%; height: 280px; margin-bottom: 20px; cursor: pointer; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; border-radius: 12px; border: 1px solid var(--border); box-sizing: border-box; padding: 20px; }
        .card-back { transform: rotateY(180deg); background: #f8fafc; }
        .hanzi-large { font-size: 64px; font-weight: bold; margin-bottom: 10px; color: #111; }
        .pinyin { font-size: 20px; color: var(--gray-text); margin-bottom: 10px; }
        .meaning { font-size: 24px; font-weight: bold; color: var(--primary); }
        .writer-box { display: flex; flex-direction: column; align-items: center; background: #fafafa; border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        #character-target { width: 120px; height: 120px; background: white; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; }
        .writer-controls { display: flex; gap: 10px; }
        .btn-small { padding: 6px 12px; font-size: 13px; background: #e5e7eb; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-small:hover { background: #d1d5db; }
        .controls { display: flex; justify-content: space-between; align-items: center; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .counter { font-size: 16px; font-weight: 600; color: var(--gray-text); }
        .quiz-box { background: #fafafa; border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .quiz-question { font-size: 22px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn { background: white; border: 1px solid var(--border); padding: 12px 16px; text-align: left; font-size: 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .option-btn:hover { background: #f1f5f9; }
        .option-btn.correct { background: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; }
        .option-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .quiz-score { text-align: center; font-size: 18px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 Ôn Tập Từ Vựng Tiếng Trung</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('flashcard')">🃏 Flashcard & Nét Chữ</button>
        <button class="tab-btn" onclick="switchTab('quiz')">✍️ Trắc Nghiệm</button>
    </div>
    <div id="flashcard-tab" class="tab-content active">
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="cardElement">
                <div class="card-face">
                    <div class="hanzi-large" id="fc-hanzi">你好</div>
                    <div class="pinyin" id="fc-pinyin">nǐ hǎo</div>
                    <div style="font-size: 13px; color: #9ca3af;">(Bấm để lật xem nghĩa)</div>
                </div>
                <div class="card-face card-back">
                    <div class="meaning" id="fc-meaning">Xin chào</div>
                    <div style="margin-top: 15px;">
                        <button class="btn-small" onclick="event.stopPropagation(); playAudio(currentList[currentIndex].hanzi)">🔊 Nghe phát âm</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="writer-box">
            <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--gray-text);">Thứ tự nét viết:</div>
            <div id="character-target"></div>
            <div class="writer-controls">
                <button class="btn-small" onclick="writer.animateCharacter()">▶ Chạy nét</button>
                <button class="btn-small" onclick="writer.quiz()">✏️ Tập viết</button>
            </div>
        </div>
        <div class="controls">
            <button class="btn" onclick="prevCard()">&larr; Trước</button>
            <div class="counter" id="fc-counter">1 / 5</div>
            <button class="btn" onclick="nextCard()">Sau &rarr;</button>
        </div>
    </div>
    <div id="quiz-tab" class="tab-content">
        <div class="quiz-box">
            <div style="font-size: 14px; color: var(--gray-text); margin-bottom: 5px;" id="quiz-progress">Câu hỏi 1/5</div>
            <div class="quiz-question" id="quiz-question-text"></div>
            <div class="options-list" id="quiz-options"></div>
            <button class="btn" id="next-quiz-btn" style="width: 100%; display: none;" onclick="nextQuiz()">Câu tiếp theo</button>
            <div class="quiz-score" id="quiz-score-display"></div>
        </div>
    </div>
</div>
<script>
    const vocabData = [
        { hanzi: "你好", pinyin: "nǐ hǎo", meaning: "Xin chào" },
        { hanzi: "谢谢", pinyin: "xièxiè", meaning: "Cảm ơn" },
        { hanzi: "再见", pinyin: "zàijiàn", meaning: "Tạm biệt" },
        { hanzi: "爱", pinyin: "ài", meaning: "Yêu, thích" },
        { hanzi: "学习", pinyin: "xuéxí", meaning: "Học tập" },
        { hanzi: "中国", pinyin: "zhōngguó", meaning: "Trung Quốc" }
    ];
    let currentList = vocabData;
    let currentIndex = 0;
    let isFlipped = false;
    let writer = null;

    function initWriter(char) {
        const container = document.getElementById('character-target');
        container.innerHTML = "";
        writer = HanziWriter.create('character-target', char, {
            width: 120, height: 120, padding: 5,
            showOutline: true, strokeAnimationSpeed: 1,
            delayBetweenStrokes: 300, strokeColor: '#4f46e5'
        });
    }

    function updateCard() {
        isFlipped = false;
        document.getElementById('cardElement').classList.remove('flipped');
        const item = currentList[currentIndex];
        document.getElementById('fc-hanzi').innerText = item.hanzi;
        document.getElementById('fc-pinyin').innerText = item.pinyin;
        document.getElementById('fc-meaning').innerText = item.meaning;
        document.getElementById('fc-counter').innerText = `${currentIndex + 1} / ${currentList.length}`;
        initWriter(item.hanzi.charAt(0));
    }

    function flipCard() {
        isFlipped = !isFlipped;
        document.getElementById('cardElement').classList.toggle('flipped', isFlipped);
    }

    function nextCard() {
        currentIndex = (currentIndex + 1) % currentList.length;
        updateCard();
    }

    function prevCard() {
        currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
        updateCard();
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        if (tabName === 'flashcard') {
            document.querySelector('.tabs button:nth-child(1)').classList.add('active');
            document.getElementById('flashcard-tab').classList.add('active');
            updateCard();
        } else {
            document.querySelector('.tabs button:nth-child(2)').classList.add('active');
            document.getElementById('quiz-tab').classList.add('active');
            initQuiz();
        }
    }

    let quizIndex = 0, score = 0, shuffledQuizList = [];
    function initQuiz() {
        quizIndex = 0; score = 0;
        shuffledQuizList = [...vocabData].sort(() => Math.random() - 0.5);
        loadQuizQuestion();
    }

    function loadQuizQuestion() {
        document.getElementById('next-quiz-btn').style.display = 'none';
        document.getElementById('quiz-score-display').innerText = '';
        if (quizIndex >= shuffledQuizList.length) {
            document.getElementById('quiz-question-text').innerText = "🎉 Hoàn thành bài trắc nghiệm!";
            document.getElementById('quiz-options').innerHTML = '';
            document.getElementById('quiz-score-display').innerText = `Điểm số của bạn: ${score} / ${vocabData.length}`;
            document.getElementById('next-quiz-btn').innerText = "Làm lại bài";
            document.getElementById('next-quiz-btn').style.display = 'block';
            document.getElementById('next-quiz-btn').onclick = initQuiz;
            return;
        }
        document.getElementById('next-quiz-btn').innerText = "Câu tiếp theo";
        document.getElementById('next-quiz-btn').onclick = nextQuiz;
        const currentQ = shuffledQuizList[quizIndex];
        document.getElementById('quiz-progress').innerText = `Câu hỏi ${quizIndex + 1} / ${shuffledQuizList.length}`;
        document.getElementById('quiz-question-text').innerHTML = `Nghĩa của từ <span style="color:var(--primary);">${currentQ.hanzi}</span> (${currentQ.pinyin}) là gì?`;
        let options = [currentQ.meaning];
        while (options.length < 4 && options.length < vocabData.length) {
            let randomOpt = vocabData[Math.floor(Math.random() * vocabData.length)].meaning;
            if (!options.includes(randomOpt)) options.push(randomOpt);
        }
        options.sort(() => Math.random() - 0.5);
        const optionsContainer = document.getElementById('quiz-options');
        optionsContainer.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, currentQ.meaning);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedOpt, correctOpt) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);
        if (selectedOpt === correctOpt) {
            selectedBtn.classList.add('correct');
            score++;
        } else {
            selectedBtn.classList.add('wrong');
            allBtns.forEach(b => { if (b.innerText === correctOpt) b.classList.add('correct'); });
        }
        document.getElementById('next-quiz-btn').style.display = 'block';
    }

    function nextQuiz() { quizIndex++; loadQuizQuestion(); }
    updateCard();
</script>
</body>
</html>
