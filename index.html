<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ha Moon Chinese - Tiếng Trung Lê Thị Hà</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e11d48;
            --primary-light: #fff1f2;
            --primary-dark: #be123c;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(135deg, #fff 0%, #fff1f2 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.02);
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 48px; height: 48px;
            background: var(--primary);
            color: white;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 700;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
        }
        .logo-title h2 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
        .logo-title p { font-size: 0.85rem; color: var(--text-muted); }
        .badge-hsk {
            background: var(--primary-light);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid #fecdd3;
        }

        .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }

        .nav-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 24px;
            scrollbar-width: thin;
        }
        .nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            color: var(--text-muted);
        }
        .nav-btn:hover { border-color: var(--primary); color: var(--primary); }
        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .lesson-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .lesson-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1);
        }
        .lesson-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .lesson-tag {
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .lesson-num { font-weight: 700; color: var(--text-muted); font-size: 0.85rem; }
        .lesson-title h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
        .lesson-title p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; }
        .lesson-meta {
            display: flex;
            gap: 16px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Modal nội dung bài học */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            width: 100%; max-width: 900px;
            max-height: 90vh;
            border-radius: var(--radius);
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            animation: modalShow 0.3s ease;
            overflow: hidden;
        }
        @keyframes modalShow {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: #fff;
        }
        .modal-close {
            background: var(--bg-body); border: none; width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; color: var(--text-muted); transition: var(--transition);
        }
        .modal-close:hover { background: var(--primary-light); color: var(--primary); }

        .modal-body { padding: 24px; overflow-y: auto; flex: 1; }

        .section-title {
            font-size: 1.1rem; font-weight: 700; color: var(--primary);
            margin: 24px 0 12px 0; display: flex; align-items: center; gap: 8px;
        }
        .section-title:first-child { margin-top: 0; }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .vocab-item {
            background: var(--bg-body);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            text-align: center;
            transition: var(--transition);
        }
        .vocab-item:hover { border-color: var(--primary); background: var(--primary-light); }
        .vocab-hanzi { font-size: 1.5rem; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
        .vocab-pinyin { font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-bottom: 4px; }
        .vocab-meaning { font-size: 0.85rem; color: var(--text-muted); }

        .grammar-box {
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            padding: 16px; border-radius: 0 10px 10px 0;
            font-size: 0.95rem; color: var(--text-main);
        }
        .grammar-box h3 { color: var(--primary); margin-bottom: 6px; font-size: 1rem; }

        .translate-item {
            background: var(--bg-body);
            border: 1px solid var(--border);
            padding: 12px 16px; border-radius: 10px;
            margin-bottom: 10px;
        }
        .translate-prompt { font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .translate-answer { color: var(--primary); font-size: 0.9rem; font-weight: 500; display: none; }
        .translate-answer.show { display: block; margin-top: 4px; }
        .btn-toggle {
            background: none; border: 1px solid var(--primary); color: var(--primary);
            padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;
            cursor: pointer; margin-top: 6px; transition: var(--transition);
        }
        .btn-toggle:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">Hà</div>
            <div class="logo-title">
                <h2>Ha Moon Chinese</h2>
                <p>Tiếng Trung chuẩn HSK 3.0 - Lê Thị Hà</p>

        <div class="badge-hsk">HSK 1 Standard</div>

    <div class="container">

            <button class="nav-btn" onclick="filterLevel('HSK 1')">HSK 1 (150 Từ vựng)</button>
        </div>

        <div class="lessons-grid" id="lessonsGrid">

        </div>
    </div>

    <!-- Modal Chi Tiết Bài Học -->
    <div class="modal" id="lessonModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <span id="modalTag" class="lesson-tag">HSK 1</span>

            </div>
            <div class="modal-body" id="modalBody">

            </div>
        </div>
    </div>

    <script>
        const lessonsData = [
            {
                id: 1, level: "HSK 1", titleNum: "第1课", title: "基础代名词与问候", sub: "Đại từ cơ bản và Chào hỏi",
                vocab: [
                    { hanzi: "我", pinyin: "wǒ", meaning: "tôi, ta, mình" },
                    { hanzi: "你", pinyin: "nǐ", meaning: "anh, chị, bạn..." },
                    { hanzi: "他", pinyin: "tā", meaning: "anh ấy, ông ấy..." },
                    { hanzi: "她", pinyin: "tā", meaning: "cô ấy, bà ấy..." },
                    { hanzi: "我们", pinyin: "wǒmen", meaning: "chúng ta" },
                    { hanzi: "好", pinyin: "hǎo", meaning: "khỏe, tốt..." },
                    { hanzi: "再见", pinyin: "zàijiàn", meaning: "tạm biệt" },
                    { hanzi: "谢谢", pinyin: "xièxie", meaning: "cảm ơn" },
                    { hanzi: "不客气", pinyin: "búkèqi", meaning: "đừng khách sáo" },
                    { hanzi: "对不起", pinyin: "duìbùqi", meaning: "xin lỗi" },
                    { hanzi: "没关系", pinyin: "méi guānxi", meaning: "không sao đâu" },

                grammar: `<h3>1. Đại từ nhân xưng cơ bản</h3><p>我 (tôi), 你 (bạn), 他/她 (anh ấy/cô ấy). Thêm 们 (men) đằng sau để chuyển thành số nhiều (ví dụ: 我们 - chúng ta).</p>`,

            {

                    { hanzi: "三", pinyin: "sān", meaning: "số 3" },
                    { hanzi: "四", pinyin: "sì", meaning: "số 4" },
                    { hanzi: "五", pinyin: "wǔ", meaning: "số 5" },
                    { hanzi: "六", pinyin: "liù", meaning: "số 6" },
                    { hanzi: "七", pinyin: "qī", meaning: "số 7" },
                    { hanzi: "八", pinyin: "bā", meaning: "số 8" },

                    { hanzi: "多少", pinyin: "duōshao", meaning: "bao nhiêu" }

            {

                vocab: [

                    { hanzi: "冷", pinyin: "lěng", meaning: "lạnh" },

                    { hanzi: "高兴", pinyin: "gāoxìng", meaning: "vui, phấn khởi" },
                    { hanzi: "漂亮", pinyin: "piàoliang", meaning: "đẹp" },
                    { hanzi: "好", pinyin: "hǎo", meaning: "tốt, khỏe" }
                ],
                grammar: `<h3>1. Câu tính từ vị ngữ</h3><p>Tính từ làm vị ngữ, thường đi kèm phó từ mức độ 很 (rất).</p>`,

                vocab: [
                    { hanzi: "的", pinyin: "de", meaning: "trợ từ sở hữu/định ngữ" },
                    { hanzi: "了", pinyin: "le", meaning: "trợ từ ngữ khí" },
                    { hanzi: "吗", pinyin: "ma", meaning: "trợ từ nghi vấn" },
                    { hanzi: "呢", pinyin: "ne", meaning: "trợ từ hỏi ngược lại" },
                    { hanzi: "很", pinyin: "hěn", meaning: "rất" },
                    { hanzi: "太", pinyin: "tài", meaning: "quá, lắm" },
                    { hanzi: "都", pinyin: "dōu", meaning: "đều" },

                    { hanzi: "飞机", pinyin: "fēijī", meaning: "máy bay" },
                    { hanzi: "出租车", pinyin: "chūzūchē", meaning: "taxi" },
                    { hanzi: "电话", pinyin: "diànhuà", meaning: "điện thoại" },
                    { hanzi: "喂", pinyin: "wèi", meaning: "a lô, này" },
                    { hanzi: "工作", pinyin: "gōngzuò", meaning: "làm việc" },
                    { hanzi: "学习", pinyin: "xuéxí", meaning: "học tập" },

                translate: [
                    { prompt: "Dịch sang tiếng Việt: 认识你很高兴。", answer: "Rất vui được làm quen với bạn." }
                ]
            }
        ];

        function renderLessons(filter = 'all') {
            const grid = document.getElementById('lessonsGrid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? lessonsData : lessonsData.filter(l => l.level === filter);
            
            filtered.forEach(lesson => {
                const card = document.createElement('div');
                card.className = 'lesson-card';
                card.onclick = () => openModal(lesson.id);
                card.innerHTML = `
                    <div>
                        <div class="lesson-header">
                            <span class="lesson-tag">${lesson.level}</span>
                            <span class="lesson-num">${lesson.titleNum}</span>
                        </div>
                        <div class="lesson-title">
                            <h3>${lesson.title}</h3>
                            <p>${lesson.sub}</p>
                        </div>
                    </div>
                    <div class="lesson-meta">
                        <span>📖 ${lesson.vocab.length} từ vựng</span>
                        <span>✍️ ${lesson.translate.length} câu dịch</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterLevel(level) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderLessons(level);
        }

        function openModal(id) {
            const lesson = lessonsData.find(l => l.id === id);
            if (!lesson) return;

            document.getElementById('modalTag').innerText = lesson.level;
            document.getElementById('modalTitle').innerText = `${lesson.titleNum} - ${lesson.title} (${lesson.sub})`;
            
            let vocabHtml = lesson.vocab.map(v => `
                <div class="vocab-item">
                    <div class="vocab-hanzi">${v.hanzi}</div>
                    <div class="vocab-pinyin">${v.pinyin}</div>
                    <div class="vocab-meaning">${v.meaning}</div>
                </div>
            `).join('');

            let translateHtml = lesson.translate.map((t, idx) => `
                <div class="translate-item">
                    <div class="translate-prompt">${t.prompt}</div>
                    <button class="btn-toggle" onclick="toggleAnswer(this)">Xem đáp án</button>
                    <div class="translate-answer"><strong>Đáp án:</strong> ${t.answer}</div>
                </div>
            `).join('');

            document.getElementById('modalBody').innerHTML = `
                <div class="section-title">📚 Danh sách từ vựng</div>
                <div class="vocab-grid">${vocabHtml}</div>
                
                <div class="section-title">💡 Ngữ pháp HSK 3.0</div>
                <div class="grammar-box">${lesson.grammar}</div>

                <div class="section-title">📝 Bài tập dịch câu</div>
                <div>${translateHtml}</div>
            `;

            document.getElementById('lessonModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('lessonModal').classList.remove('active');
        }

        function toggleAnswer(btn) {
            const answerDiv = btn.nextElementSibling;
            if (answerDiv.classList.contains('show')) {
                answerDiv.classList.remove('show');
                btn.innerText = 'Xem đáp án';
            } else {
                answerDiv.classList.add('show');
                btn.innerText = 'Ẩn đáp án';
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('lessonModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Khởi chạy khi load trang
        renderLessons('all');
    </script>
</body>
